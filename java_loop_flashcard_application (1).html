<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Loops: Code Application Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
        }
        .code-font { font-family: 'Fira Code', monospace; }
        
        /* Flashcard Flip Animation */
        .card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .card-flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .card-back {
            transform: rotateY(180deg);
        }

        /* Accessibility Focus Styles */
        button:focus-visible, .card-container:focus-visible {
            outline: 3px solid #3b82f6;
            outline-offset: 2px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-900">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-20 shadow-sm">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-blue-700">Java Loop Flashcards</h1>
                <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">CIT 130: Computer Science I</p>
            </div>
            <div class="text-right">
                <div id="progress-text" class="text-sm font-bold text-slate-600" aria-live="polite">Card 1 of 8</div>
                <div class="w-24 bg-slate-200 h-1.5 rounded-full mt-1">
                    <div id="progress-bar" class="bg-blue-600 h-full rounded-full transition-all duration-300" style="width: 12.5%"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-6">
        
        <!-- Flashcard Container -->
        <div 
            id="card-container"
            class="card-container relative w-full max-w-2xl h-96 perspective-1000 group focus:outline-none"
            role="button"
            aria-label="Flashcard. Press Space or Click to flip."
            tabindex="0"
            onclick="flipCard()"
        >
            <div id="card-inner" class="card-inner relative w-full h-full">
                
                <!-- Front Side -->
                <div class="card-front absolute inset-0 bg-white border-2 border-slate-200 rounded-3xl shadow-xl p-8 flex flex-col items-center justify-center text-center">
                    <span class="absolute top-6 left-8 text-xs font-bold text-slate-400 uppercase">Question / Scenario</span>
                    <div id="card-front-text" class="text-xl md:text-2xl font-semibold leading-relaxed text-slate-800">
                        Loading...
                    </div>
                    <p class="mt-8 text-sm text-slate-400 italic">Click or press Space to see answer</p>
                </div>

                <!-- Back Side -->
                <div class="card-back absolute inset-0 bg-blue-50 border-2 border-blue-200 rounded-3xl shadow-xl p-8 flex flex-col items-center justify-center text-center overflow-y-auto">
                    <span class="absolute top-6 left-8 text-xs font-bold text-blue-400 uppercase">Answer & Code</span>
                    <div id="card-back-text" class="text-lg md:text-xl font-medium text-slate-800 mb-6">
                        Loading...
                    </div>
                    <div id="card-code" class="w-full bg-slate-900 rounded-xl p-4 text-left overflow-x-auto border border-slate-700 shadow-inner">
                        <pre class="code-font text-blue-300 text-sm leading-tight"><code id="code-content"></code></pre>
                    </div>
                </div>

            </div>
        </div>

        <!-- Hint Section -->
        <div class="mt-8 w-full max-w-md text-center">
            <button 
                onclick="toggleHint()" 
                class="text-blue-600 font-semibold text-sm hover:underline flex items-center justify-center gap-2 mx-auto mb-2"
                aria-expanded="false"
                id="hint-toggle"
            >
                <span>💡 Need a hint?</span>
            </button>
            <div id="hint-text" class="hidden bg-amber-50 text-amber-800 p-3 rounded-lg border border-amber-200 text-sm italic" aria-live="polite">
            </div>
        </div>

    </main>

    <!-- Navigation Controls -->
    <footer class="bg-white border-t border-slate-200 p-6">
        <div class="max-w-3xl mx-auto flex flex-col gap-6">
            <div class="flex justify-between items-center">
                <button 
                    onclick="prevCard()" 
                    id="prev-btn"
                    class="px-6 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 disabled:opacity-30 flex items-center gap-2 transition-all"
                    aria-label="Previous card"
                >
                    ← Previous
                </button>

                <div class="flex gap-4">
                    <button 
                        onclick="markStatus('NEEDS_REVIEW')" 
                        class="p-3 bg-red-50 text-red-600 rounded-full hover:bg-red-100 shadow-sm border border-red-100"
                        title="Mark for review"
                        aria-label="Mark as needs review"
                    >
                        🚩
                    </button>
                    <button 
                        onclick="markStatus('MASTERED')" 
                        class="p-3 bg-emerald-50 text-emerald-600 rounded-full hover:bg-emerald-100 shadow-sm border border-emerald-100"
                        title="Mark as mastered"
                        aria-label="Mark as mastered"
                    >
                        ✅
                    </button>
                </div>

                <button 
                    onclick="nextCard()" 
                    id="next-btn"
                    class="px-6 py-2 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 disabled:opacity-30 flex items-center gap-2 transition-all shadow-md shadow-blue-200"
                    aria-label="Next card"
                >
                    Next →
                </button>
            </div>

            <!-- Stats Bar -->
            <div class="flex justify-center gap-8 text-xs font-bold uppercase tracking-widest text-slate-400 border-t pt-4">
                <div>Mastered: <span id="stats-mastered" class="text-emerald-600">0</span></div>
                <div>Review: <span id="stats-review" class="text-red-600">0</span></div>
            </div>
        </div>
    </footer>

    <script>
        const flashcards = [
            {
                front: "How do you repeat the entire program based on user input?",
                back: "Use a while loop checking a flag variable.",
                code: 'while (again.equalsIgnoreCase("Y")) {\n    // main logic here\n    System.out.print("Perform another? (Y/N): ");\n    again = input.next();\n}',
                hint: "Look at the outermost loop in the main method."
            },
            {
                front: "What loop should you use to force a user to enter a valid age (greater than 0)?",
                back: "A while loop for input validation.",
                code: 'while (currentAge <= 0) {\n    System.out.println("Must be > 0.");\n    System.out.print("Reenter age: ");\n    currentAge = input.nextInt();\n}',
                hint: "Use this when you don't know how many times the user will make a mistake."
            },
            {
                front: "Which loop is used to calculate savings over a fixed number of years?",
                back: "A for loop.",
                code: 'for (int year = 1; year <= years; year++) {\n    noInterestBalance += annualSavings;\n}',
                hint: "Use this when the range (number of iterations) is known."
            },
            {
                front: "Why is input.nextLine() used after input.next()?",
                back: "To clear the leftover newline character in the scanner buffer.",
                code: 'again = input.next();\ninput.nextLine(); // Clear buffer',
                hint: "Prevents the scanner from skipping the next input prompt."
            },
            {
                front: "How do you calculate the square root of the balance?",
                back: "Use the Math.sqrt() method.",
                code: 'squareRoot = Math.sqrt(interestBalance);',
                hint: "Part of the standard Java Math class."
            },
            {
                front: "How do you format output as currency with commas and 2 decimals?",
                back: "Use System.out.printf with the \"$%,.2f\" specifier.",
                code: 'System.out.printf("Balance: $%,.2f\\n", balance);',
                hint: "The '%' starts formatting, ',' adds commas, and '.2f' handles decimals."
            },
            {
                front: "How do you get the first letter of a user's name?",
                back: "Use the .charAt(0) method on a String.",
                code: 'System.out.println("First Char: " + name.charAt(0));',
                hint: "Remember that Java strings are 0-indexed."
            },
            {
                front: "Why reset balance variables to zero inside the outer while loop?",
                back: "To prevent values from one calculation from carrying over to the next user.",
                code: 'noInterestBalance = 0;\ninterestBalance = 0;',
                hint: "Think about user state if the program runs multiple times."
            }
        ];

        let currentIndex = 0;
        let isFlipped = false;
        let userData = JSON.parse(localStorage.getItem('javaFlashcardData')) || { mastered: [], review: [] };

        // Initialize
        window.onload = () => {
            renderCard();
            updateStats();
            
            // Keyboard Listeners
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    flipCard();
                } else if (e.code === 'ArrowRight') {
                    nextCard();
                } else if (e.code === 'ArrowLeft') {
                    prevCard();
                }
            });
        };

        function renderCard() {
            const card = flashcards[currentIndex];
            document.getElementById('card-front-text').innerText = card.front;
            document.getElementById('card-back-text').innerText = card.back;
            document.getElementById('code-content').innerText = card.code;
            document.getElementById('hint-text').innerText = card.hint;
            
            // Reset Flip
            isFlipped = false;
            document.getElementById('card-container').classList.remove('card-flipped');
            
            // Reset Hint
            document.getElementById('hint-text').classList.add('hidden');
            document.getElementById('hint-toggle').setAttribute('aria-expanded', 'false');

            // Update UI
            document.getElementById('progress-text').innerText = `Card ${currentIndex + 1} of ${flashcards.length}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / flashcards.length) * 100}%`;
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === flashcards.length - 1;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('card-container').classList.toggle('card-flipped');
        }

        function nextCard() {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function toggleHint() {
            const hint = document.getElementById('hint-text');
            const toggle = document.getElementById('hint-toggle');
            const isHidden = hint.classList.toggle('hidden');
            toggle.setAttribute('aria-expanded', !isHidden);
        }

        function markStatus(status) {
            // Remove from both lists first
            userData.mastered = userData.mastered.filter(i => i !== currentIndex);
            userData.review = userData.review.filter(i => i !== currentIndex);

            if (status === 'MASTERED') {
                userData.mastered.push(currentIndex);
            } else {
                userData.review.push(currentIndex);
            }

            localStorage.setItem('javaFlashcardData', JSON.stringify(userData));
            updateStats();
            
            // Auto-advance if mastered
            if (status === 'MASTERED' && currentIndex < flashcards.length - 1) {
                setTimeout(nextCard, 300);
            }
        }

        function updateStats() {
            document.getElementById('stats-mastered').innerText = userData.mastered.length;
            document.getElementById('stats-review').innerText = userData.review.length;
        }
    </script>
</body>
</html>
